# prq reads ~/.config/prq/config.toml, or the file passed with --config.
# Every setting is optional; uncomment one to change it from the default shown.

# Only look at these organizations (or users). Omit to include everything you can see.
# orgs = ["acme"]

# Only look at these repositories. Use "owner/name", or a bare "name" to match it in any org.
# Omit to include every repository.
# repos = ["acme/web", "api"]

# port = 4747
# refresh_seconds = 300

# Open the dashboard in the browser on launch. `--no-open` overrides this.
# open_browser = true
